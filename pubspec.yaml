name: sunvolt_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  google_fonts: ^8.0.2
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_SunVolt.png"
  min_sdk_android: 21 # android_min_sdk_version

flutter:
  uses-material-design: true
  assets:
    - assets/images/
